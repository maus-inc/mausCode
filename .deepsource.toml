version = 1

exclude_patterns = [
  "build/**",
  "out/**",
  "release/**",
  "resources/bin/**",
  "runtime/jcode/**",
  "src/main/lib/codex-app-server/src/_generated/**",
  # The remaining files in scripts/ci are ES modules, and the analyzer's parser
  # reads .mjs as a script regardless of module_system below, reporting JS-0833
  # on the first import. That was measured on 2026-09-15 at 8e3cdf9, after the
  # module_system key had already been set, and again at ad93a44, where this
  # same entry was already present, so this exclusion only takes effect once it
  # reaches the default branch, which is the branch the analyzer reads its
  # configuration from. lint-changed is .cjs rather than excluded, because it is
  # the file a pull request touches. Biome gates all of them in the quality job.
  "scripts/ci/**",
]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  # The repository is ES modules everywhere except the vendored runtime, and
  # this key is still correct for the .js and .ts files the analyzer does
  # parse. It does not settle the .mjs parse error, which the exclusion above
  # handles.
  module_system = "es-modules"
  environment = ["nodejs", "browser"]
