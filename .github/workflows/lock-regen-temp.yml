# TEMPORARY: regenerate bun.lock on a runner with bun. Deleted right after
# the regenerated lock is committed (see commit message when removed).
name: lock-regen-temp
on:
  workflow_dispatch: null
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a08de4-mauscode
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Regenerate lockfile (scripts skipped: native modules unneeded)
        run: bun install --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: bun-lock-regen
          path: bun.lock
