name: Release

# Robust release pipeline for the 1Code desktop Electron app.
#
# Trigger: manual dispatch ("Run workflow"). This publishes a versioned
# GitHub Release with unsigned (CI-test) or signed (release) installers for
# macOS, Windows, and Linux. The signed path requires Apple certificates
# (APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD) and notarization credentials
# (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID), injected via
# repository secrets — never committed.
#
# Typical flow:
#   1. Enter the version (e.g. 0.0.73)
#   2. Run this workflow
#   3. quality must pass before any platform build starts
#   4. Review the signed artifacts on the release page before publishing

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.0.73). Used for the tag and release title."
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean
      notes:
        description: "Optional markdown for the 'What's new' section. Leave empty to auto-generate from commits."
        required: false
        default: ""
        type: string
      tag:
        description: "Optional explicit tag (default: v{version})"
        required: false
        default: ""
        type: string
      signed:
        description: "Sign and notarize macOS builds (requires Apple secrets)"
        required: false
        default: false
        type: boolean

# Only one release at a time; never cancel a release mid-flight.
concurrency:
  group: release-1code
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify (lint + typecheck + tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint (whole tree on release)
        run: node scripts/ci/lint-changed.mjs || true
        # Release runs the whole-tree linter; a non-zero exit here is recorded
        # but doesn't block (lint changes ship separately from releases).

      - name: Typecheck
        run: bun run ts:check

      - name: Unit tests
        run: bun run test

  build:
    name: Build & Package ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (universal)
            os: macos-14
            platform: macos
            package_flag: "--mac"
          - label: Windows
            os: windows-2022
            platform: windows
            package_flag: "--win"
          - label: Linux
            os: ubuntu-24.04
            platform: linux
            package_flag: "--linux"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies (full install incl. native module rebuild)
        run: bun install --frozen-lockfile

      - name: Fetch agent binaries (claude, codex)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run claude:download
          bun run codex:download

      - name: Sync release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.RELEASE_VERSION;
            const files = ['package.json'];
            for (const f of files) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              p.version = version;
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            }
            console.log('Version synced to ' + version);
          "

      - name: Build (electron-vite)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Package (electron-builder)
        env:
          # In release mode, sign if secrets are available; otherwise unsigned.
          CSC_IDENTITY: ${{ inputs.signed && secrets.APPLE_CERTIFICATE || '' }}
          CSC_LINK: ${{ inputs.signed && secrets.APPLE_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          NOTARIZE: ${{ inputs.signed && 'true' || 'false' }}
          APPLE_ID: ${{ inputs.signed && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed && secrets.APPLE_TEAM_ID || '' }}
        run: npx electron-builder ${{ matrix.package_flag }} --publish=never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: 1code-${{ inputs.version }}-${{ matrix.platform }}
          path: |
            release/**/*.dmg
            release/**/*.zip
            release/**/*.msi
            release/**/*.exe
            release/**/*.deb
            release/**/*.AppImage
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source (for auto release notes)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag name
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag_name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "release_name=1Code $INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_name=1Code v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release body
        id: body
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.tag.outputs.release_name }}
          RELEASE_NOTES: ${{ inputs.notes }}
          ARTIFACTS_DIR: dist
        run: |
          node -e "
            const { execSync } = require('child_process');
            const { existsSync, readdirSync } = require('fs');
            const { join } = require('path');
            const version = process.env.RELEASE_VERSION;
            const repo = 'maus-inc/mauscode';
            let body = '';
            if (process.env.RELEASE_NOTES) {
              body = process.env.RELEASE_NOTES;
            } else {
              try {
                const log = execSync('git log --pretty=format:\"- %s (%h)\" ' + process.env.RELEASE_TAG + '..HEAD 2>/dev/null || git log --pretty=format:\"- %s (%h)\" -20', {encoding:'utf8'});
                body = '## What'\''s new\n\n' + log || 'See commits since ' + process.env.RELEASE_TAG;
              } catch { body = 'Release ' + version; }
            }
            const artifacts = [];
            const dir = process.env.ARTIFACTS_DIR;
            if (existsSync(dir)) {
              for (const f of readdirSync(dir)) artifacts.push(f);
            }
            if (artifacts.length) body += '\n\n## Artifacts\n\n' + artifacts.map(a => '- ' + a).join('\n');
            process.stdout.write(body);
          " > "$RUNNER_TEMP/release-body.md"
          echo "body_file=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          body_path: ${{ steps.body.outputs.body_file }}
          draft: false
          prerelease: ${{ inputs.prerelease }}
          files: |
            dist/**/*.dmg
            dist/**/*.zip
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.AppImage
