name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    name: Quality gates (lint, test, typecheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lint + format (changed files only)
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '00000000000000000000000000000000000000' && github.event.before) || 'origin/main' }}
        run: node scripts/ci/lint-changed.mjs
      - name: Unit tests (vitest)
        run: bun run test
      - name: "Typecheck (ratchet: no new errors vs baseline)"
        run: bun run ratchet:typecheck
      - name: "Typecheck (tsgo, second gate)"
        continue-on-error: true
        run: bun run ts:check
      - name: SonarCloud Analysis
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build all targets (main, preload, renderer)
        run: bun run build
      - name: Report bundle sizes
        shell: bash
        run: du -sh out/main out/preload out/renderer 2>/dev/null || true

  package:
    name: Package (${{ matrix.os }}, unsigned)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies (full install incl. native module rebuild)
        run: bun install --frozen-lockfile
      - name: Fetch bundled agent binaries for this platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run claude:download
          bun run codex:download
      - name: Build
        run: bun run build
      - name: Package (electron-builder --dir, no signing/notarization)
        run: bunx electron-builder --dir
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: release/
          retention-days: 5

  security:
    name: Security gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: "Dependency audit (ratchet: no new critical advisories)"
        run: bun run ratchet:audit
      - name: Secrets scan (gitleaks, pinned + checksum-verified)
        run: |
          set -Eeuo pipefail
          VERSION=8.30.1
          EXPECTED=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}" -o /tmp/gitleaks.tar.gz
          echo "${EXPECTED}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          rm -f /tmp/gitleaks-report.json
          status=0
          /tmp/gitleaks dir --config .gitleaks.toml --verbose --redact \
            --report-format json --report-path /tmp/gitleaks-report.json . || status=$?
          if [ "$status" -ne 0 ]; then
            if [ -s /tmp/gitleaks-report.json ]; then
              count=$(jq 'length' /tmp/gitleaks-report.json)
              index=$(jq -r '.[]? | "\(.RuleID) \(.File):\(.StartLine)"' /tmp/gitleaks-report.json |
                awk 'NR>1{printf "%%0A"} {printf "%s", $0}')
              echo "::error title=gitleaks: ${count} finding(s), values redacted::${index}"
              jq -r '.[]? | "::error file=\(.File),line=\(.StartLine),title=gitleaks \(.RuleID)::\(.RuleID) at \(.File):\(.StartLine), value redacted"' \
                /tmp/gitleaks-report.json > /tmp/gitleaks-annotations.txt || true
              cat /tmp/gitleaks-annotations.txt
              {
                echo "### Secrets scan failed (gitleaks ${VERSION})"
                echo
                echo "Values are redacted; rule, file and line only."
                echo
                echo "| Rule | File | Line |"
                echo "| --- | --- | --- |"
                jq -r '.[]? | "| \(.RuleID) | \(.File) | \(.StartLine) |"' /tmp/gitleaks-report.json
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error title=Secrets scan::exit ${status} with no JSON report, read the step log"
            fi
            exit "$status"
          fi
      - name: Dependency review (PR-affecting changes)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
